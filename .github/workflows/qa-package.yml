name: Compilar y publicar QA

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_version:
        description: Versión semántica que se publicará (por ejemplo, 1.4.9)
        type: string
        required: false
        default: ""
      publish:
        description: Publicar esta compilación para los QA
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: qa-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.release_version || format('1.4.{0}', github.run_number) }}

jobs:
  build-windows:
    name: Probar y crear paquetes
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar versión de entrega
        shell: powershell
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "La versión '$env:RELEASE_VERSION' no usa el formato X.Y.Z."
          }

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validar configuración QA
        shell: powershell
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:QA_API_URL)) {
            throw "Falta configurar el secreto QA_API_URL en GitHub."
          }
          if ([string]::IsNullOrWhiteSpace($env:QA_API_TOKEN)) {
            throw "Falta configurar el secreto QA_API_TOKEN en GitHub."
          }
          if (-not $env:QA_API_URL.StartsWith("https://")) {
            throw "QA_API_URL debe usar HTTPS."
          }

      - name: Intentar descargar base publicada
        shell: powershell
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .ci\base | Out-Null
          $auth = "Authorization: Bearer $env:QA_API_TOKEN"

          $packageOk = $false
          $manifestOk = $false

          & curl.exe --fail --silent --show-error --location `
            --header $auth --header "ngrok-skip-browser-warning: 1" `
            "$env:QA_API_URL/api/updates/windows/package" `
            --output .ci\base\current.zip
          if ($LASTEXITCODE -eq 0) { $packageOk = $true }

          & curl.exe --fail --silent --show-error --location `
            --header $auth --header "ngrok-skip-browser-warning: 1" `
            "$env:QA_API_URL/api/updates/windows/build-manifest" `
            --output .ci\base\previous-manifest.json
          if ($LASTEXITCODE -eq 0) { $manifestOk = $true }

          if ($packageOk -and $manifestOk) {
            try {
              Expand-Archive -LiteralPath .ci\base\current.zip -DestinationPath .ci\base\image -Force
              $legacy = Get-ChildItem .ci\base\image -Directory |
                Where-Object Name -eq "AsociacionComunalQA" |
                Select-Object -First 1 -ExpandProperty FullName
              if ($legacy) {
                "HAS_QA_BASE=true" >> $env:GITHUB_ENV
                "LEGACY_IMAGE=$legacy" >> $env:GITHUB_ENV
                Write-Host "Se reutilizará la versión QA publicada como base incremental."
                exit 0
              }
            } catch {
              Write-Warning "La base publicada no pudo reutilizarse: $($_.Exception.Message)"
            }
          }

          Remove-Item .ci\base\current.zip -Force -ErrorAction SilentlyContinue
          Remove-Item .ci\base\previous-manifest.json -Force -ErrorAction SilentlyContinue
          "HAS_QA_BASE=false" >> $env:GITHUB_ENV
          Write-Host "No existe una base QA utilizable. Se generará una primera instalación completa."

      - name: Compilar, probar y empaquetar
        shell: powershell
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:HAS_QA_BASE -eq "true") {
            .\scripts\build-qa-package.ps1 `
              -Version $env:RELEASE_VERSION `
              -PreviousManifest .ci\base\previous-manifest.json `
              -LegacyImage $env:LEGACY_IMAGE
          } else {
            .\scripts\build-qa-package.ps1 -Version $env:RELEASE_VERSION
          }

      - name: Publicar artefacto interno
        uses: actions/upload-artifact@v4
        with:
          name: qa-release-${{ env.RELEASE_VERSION }}
          path: |
            dist/AsociacionComunalQA-${{ env.RELEASE_VERSION }}-win64.zip
            dist/AsociacionComunalQA-${{ env.RELEASE_VERSION }}-delta.zip
            dist/update-manifest.json
            dist/version.txt
            dist/sha256.txt
          if-no-files-found: error
          retention-days: 30

  deploy-qa:
    name: Activar actualización QA
    needs: build-windows
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Descargar paquete aprobado
        uses: actions/download-artifact@v4
        with:
          name: qa-release-${{ env.RELEASE_VERSION }}
          path: release

      - name: Publicar mediante la API segura
        shell: bash
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
          QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/version.txt)"
          full="release/AsociacionComunalQA-${version}-win64.zip"
          delta="release/AsociacionComunalQA-${version}-delta.zip"
          test -f "$full"
          test -f "$delta"
          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer $QA_API_TOKEN" \
            --header "ngrok-skip-browser-warning: 1" \
            --form "full=@$full;type=application/zip" \
            --form "delta=@$delta;type=application/zip" \
            --form "manifest=@release/update-manifest.json;type=application/json" \
            --form "version=@release/version.txt;type=text/plain" \
            --form "checksum=@release/sha256.txt;type=text/plain" \
            "$QA_API_URL/api/updates/windows/publish"
          echo "Versión QA $version publicada correctamente."

  release-github:
    name: Publicar aplicación en GitHub
    needs: build-windows
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar paquete aprobado
        uses: actions/download-artifact@v4
        with:
          name: qa-release-${{ env.RELEASE_VERSION }}
          path: release

      - name: Crear GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/version.txt)"
          full="release/AsociacionComunalQA-${version}-win64.zip"
          test -f "$full"
          gh release create "qa-v${version}" \
            "$full" \
            "release/sha256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asociación Comunal QA v${version}" \
            --notes "Primera instalación: descarga el ZIP, extráelo y abre AsociacionComunalQA.exe. Después, las versiones nuevas se detectan automáticamente al iniciar y mientras la aplicación permanece abierta."
