<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 1200"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Logo Asociación Comunal</title>
  <desc id="desc">Logo oficial de la Asociación Comunal dentro de una tarjeta blanca con bordes redondeados.</desc>

  <rect x="32" y="32" width="1136" height="1136" rx="128"
        fill="#FFFFFF"
        stroke="#E2E8F0"
        stroke-width="8"/>

  <!-- La referencia oficial se conserva separada para evitar reinterpretaciones del diseño. -->
  <image x="-160" y="-110" width="1520" height="1520"
         preserveAspectRatio="xMidYMid meet"
         href="logo-asociacion-comunal-reference.png"
         xlink:href="logo-asociacion-comunal-reference.png"/>
</svg>
